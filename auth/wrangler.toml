name = "winc-law-auth"
main = "worker.js"
compatibility_date = "2025-01-01"

# 取り次ぎを許すページの出どころ。開発中は localhost を足す。
[vars]
ALLOWED_ORIGINS = "https://winc1980.github.io"

# GITHUB_CLIENT_ID は秘密ではないが、ここに書かず secret で入れておくと
# OAuth App を作り直したときに worker.js を触らずに済む。
#   npx wrangler secret put GITHUB_CLIENT_ID
